name: Ota Contract Matrix

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ota_ref:
        description: Ota git ref to build from source
        required: false
        default: feat/scoped-env-requirements

permissions:
  contents: read

env:
  OTA_REF_DEFAULT: feat/scoped-env-requirements

jobs:
  matrix:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - name: Check out ota source
        uses: actions/checkout@v5
        with:
          repository: ota-run/ota
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ota_ref || env.OTA_REF_DEFAULT }}
          path: .ota-ci/ota-source

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build ota from source
        run: cargo build --release --locked
        working-directory: .ota-ci/ota-source

      - name: Add ota to PATH
        run: echo "${GITHUB_WORKSPACE}/.ota-ci/ota-source/target/release" >> "$GITHUB_PATH"

      - name: Show ota version
        run: ota --version

      - name: Run native contract suite
        run: |
          set -euo pipefail
          mkdir -p .ota-ci/logs/native
          
          run_non_blocking_task() {
            local task="$1"
            local mode="$2"
            local logfile="$3"
            set +e
            ota run "$task" --mode "$mode" --plain --stream 2>&1 | tee "$logfile"
            local task_status="${PIPESTATUS[0]}"
            set -e
            if [ "$task_status" -ne 0 ]; then
              echo "Non-blocking task failed: ota run $task --mode $mode (continuing by design)." | tee -a "$logfile"
            fi
          }

          ota validate --plain 2>&1 | tee .ota-ci/logs/native/validate.txt
          ota execution plan --workflow contributor --mode native --plain 2>&1 | tee .ota-ci/logs/native/execution-plan-native.txt
          ota up --workflow contributor --mode native --plain 2>&1 | tee .ota-ci/logs/native/up-contributor-native.txt
          ota doctor --workflow contributor --mode native --plain 2>&1 | tee .ota-ci/logs/native/doctor-native.txt

          ota run install --mode native --plain --stream 2>&1 | tee .ota-ci/logs/native/run-install-native.txt
          ota run compile --mode native --plain --stream 2>&1 | tee .ota-ci/logs/native/run-compile-native.txt
          ota run build --mode native --plain --stream 2>&1 | tee .ota-ci/logs/native/run-build-native.txt
          ota run build:firefox --mode native --plain --stream 2>&1 | tee .ota-ci/logs/native/run-build-firefox-native.txt
          ota run check:cws --mode native --plain --stream 2>&1 | tee .ota-ci/logs/native/run-check-cws-native.txt
          run_non_blocking_task test:cli native .ota-ci/logs/native/run-test-cli-native.txt
          run_non_blocking_task test:validator native .ota-ci/logs/native/run-test-validator-native.txt
          run_non_blocking_task ci:check native .ota-ci/logs/native/run-ci-check-native.txt

      - name: Run container contract suite
        run: |
          set -euo pipefail
          mkdir -p .ota-ci/logs/container
          
          run_non_blocking_task() {
            local task="$1"
            local mode="$2"
            local logfile="$3"
            set +e
            ota run "$task" --mode "$mode" --plain --stream 2>&1 | tee "$logfile"
            local task_status="${PIPESTATUS[0]}"
            set -e
            if [ "$task_status" -ne 0 ]; then
              echo "Non-blocking task failed: ota run $task --mode $mode (continuing by design)." | tee -a "$logfile"
            fi
          }

          ota execution plan --workflow contributor --mode container --plain 2>&1 | tee .ota-ci/logs/container/execution-plan-container.txt

          backend=""
          if docker info >/dev/null 2>&1; then
            backend="docker"
          elif command -v podman >/dev/null 2>&1 && podman info >/dev/null 2>&1; then
            backend="podman"
          fi

          if [ -n "$backend" ]; then
            echo "Using healthy container backend: $backend" | tee .ota-ci/logs/container/backend.txt

            image="node:20-bookworm"
            image_probe_log=".ota-ci/logs/container/image-probe.txt"
            set +e
            if [ "$backend" = "docker" ]; then
              docker run --rm "$image" node --version >"$image_probe_log" 2>&1
            else
              podman run --rm "$image" node --version >"$image_probe_log" 2>&1
            fi
            image_probe_status=$?
            set -e

            if [ "$image_probe_status" -ne 0 ]; then
              echo "Container backend is reachable but contract image is not runnable on ${RUNNER_OS}; asserting honest container-mode failure." | tee -a .ota-ci/logs/container/backend.txt
              cat "$image_probe_log"
              backend=""
            fi
          fi

          if [ -n "$backend" ]; then
            ota up --workflow contributor --mode container --plain 2>&1 | tee .ota-ci/logs/container/up-contributor-container.txt
            ota doctor --workflow contributor --mode container --plain 2>&1 | tee .ota-ci/logs/container/doctor-container.txt
            ota run install --mode container --plain --stream 2>&1 | tee .ota-ci/logs/container/run-install-container.txt
            ota run compile --mode container --plain --stream 2>&1 | tee .ota-ci/logs/container/run-compile-container.txt
            ota run build --mode container --plain --stream 2>&1 | tee .ota-ci/logs/container/run-build-container.txt
            ota run build:firefox --mode container --plain --stream 2>&1 | tee .ota-ci/logs/container/run-build-firefox-container.txt
            ota run check:cws --mode container --plain --stream 2>&1 | tee .ota-ci/logs/container/run-check-cws-container.txt
            run_non_blocking_task test:cli container .ota-ci/logs/container/run-test-cli-container.txt
            run_non_blocking_task test:validator container .ota-ci/logs/container/run-test-validator-container.txt
            run_non_blocking_task ci:check container .ota-ci/logs/container/run-ci-check-container.txt
            exit 0
          fi

          echo "No runnable container path on ${RUNNER_OS}; asserting honest container-mode failure." | tee -a .ota-ci/logs/container/backend.txt

          set +e
          ota doctor --workflow contributor --mode container --plain > .ota-ci/logs/container/doctor-container.txt 2>&1
          doctor_status=$?
          ota up --workflow contributor --mode container --plain > .ota-ci/logs/container/up-contributor-container.txt 2>&1
          up_status=$?
          set -e

          cat .ota-ci/logs/container/doctor-container.txt
          cat .ota-ci/logs/container/up-contributor-container.txt

          test "$doctor_status" -ne 0
          test "$up_status" -ne 0

          if grep -Ei "no matching manifest|image operating system|cannot be used on this platform" \
            .ota-ci/logs/container/doctor-container.txt \
            .ota-ci/logs/container/up-contributor-container.txt; then
            echo "Container-mode fallback accepted: selected image is not runnable on this host container backend."
            exit 0
          fi

          grep -E "Container execution backend unavailable|Missing container execution backend CLI" \
            .ota-ci/logs/container/doctor-container.txt
          grep -E "Container execution backend unavailable|Missing container execution backend CLI" \
            .ota-ci/logs/container/up-contributor-container.txt

      - name: Upload ota matrix logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ota-contract-matrix-${{ matrix.os }}
          path: .ota-ci/logs
