name: Ota Crossing Authority Hardened Runner Pressure

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Administrator-provisioned authority state to exercise.
        required: true
        type: choice
        options:
          - live
          - expired
          - revoked
          - out-of-scope

permissions:
  contents: read

jobs:
  signed-grant-pressure:
    name: ${{ inputs.scenario }} signed grant on hardened runner
    # A runner administrator applies exactly one scenario label only after provisioning the fixed
    # authority store, signed bundle, and sequence state. This workflow never creates or updates
    # /etc/ota or /var/lib/ota and cannot turn the dispatch input into authority.
    runs-on: [self-hosted, linux, "ota-crossing-${{ inputs.scenario }}"]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Reset only the pressure checkout state
        run: git clean -ffdx

      - name: Verify hardened runner preconditions
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test "$(id -u)" -ne 0
          if sudo -n true >/dev/null 2>&1; then
            echo "The Ota process can acquire sudo; this runner cannot evidence authority separation." >&2
            exit 1
          fi
          test -f /etc/ota/crossing-authorities.json
          test -r /etc/ota/crossing-authorities.json
          test ! -w /etc/ota/crossing-authorities.json
          test ! -w /etc/ota

      - name: Install exact Ota source from pressure contract
        uses: ota-run/setup@493cba84bf7f7c11c9e8e996d832d93a89c62184
        with:
          source: contract
          contract-path: ota-crossing-pressure.yaml

      - name: Validate and discover the governed pressure lane
        run: |
          set -euo pipefail
          ota validate --file ota-crossing-pressure.yaml --json
          ota doctor --file ota-crossing-pressure.yaml --json
          ota tasks --file ota-crossing-pressure.yaml --use --json
          ota tasks --file ota-crossing-pressure.yaml --safe --use --json

      - name: Derive the exact dry-run scope without consuming a crossing
        if: inputs.scenario == 'live'
        run: |
          set -euo pipefail
          ota run scaffold:sample --file ota-crossing-pressure.yaml --grant fixture-live --dry-run --json \
            > grant-dry-run.json
          jq -e '.ok == true and .execution_started == false and .crossing_grant_admission.decision == "admissible_not_consumed"' \
            grant-dry-run.json
          test ! -e .ota-pressure/scaffold-sample

      - name: Prove live grant creates one transaction-bound scaffold receipt
        if: inputs.scenario == 'live'
        run: |
          set -euo pipefail
          test ! -e .ota-pressure/scaffold-sample
          ota run scaffold:sample --file ota-crossing-pressure.yaml --grant fixture-live --receipt
          test -e .ota-pressure/scaffold-sample
          archive="$(find .ota/receipts -type f -name 'repo-receipt-*.json' | sort | tail -n 1)"
          test -n "$archive"
          jq -e '.receipt.crossing.authority.transaction != null' "$archive"
          ota receipt --history --file ota-crossing-pressure.yaml --json > receipt-history.json
          jq -e '.ok == true' receipt-history.json

      - name: Prove invalid grant refuses before scaffold mutation
        if: inputs.scenario != 'live'
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          set -euo pipefail
          case "$SCENARIO" in
            expired) expected_reason='crossing_grant_expired' ;;
            revoked) expected_reason='crossing_grant_revoked' ;;
            out-of-scope) expected_reason='crossing_grant_out_of_scope' ;;
            *) echo "Unsupported scenario: $SCENARIO" >&2; exit 2 ;;
          esac
          test ! -e .ota-pressure/scaffold-sample
          if ota run scaffold:sample --file ota-crossing-pressure.yaml --grant fixture-live --dry-run --json \
            > grant-dry-run.json 2>&1; then
            echo "Expected $SCENARIO dry-run grant refusal." >&2
            exit 1
          fi
          jq -e --arg expected_reason "$expected_reason" \
            '.ok == false and .execution_started == false and .crossing_grant_admission.reason_family == $expected_reason' \
            grant-dry-run.json
          if ota run scaffold:sample --file ota-crossing-pressure.yaml --grant fixture-live \
            > refusal.txt 2>&1; then
            echo "Expected $SCENARIO grant refusal." >&2
            exit 1
          fi
          rg -F "$expected_reason" refusal.txt
          test ! -e .ota-pressure/scaffold-sample
          test ! -d .ota/receipts

      - name: Preserve pressure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ota-crossing-authority-${{ inputs.scenario }}
          if-no-files-found: warn
          path: |
            *-run.json
            grant-dry-run.json
            refusal.txt
            receipt-history.json
            .ota/receipts/**

      - name: Record pressure boundary
        if: always()
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          This workflow proves only the selected pre-provisioned authority state on a non-root runner.
          It does not self-provision authority, prove the runner lacks all administrative capabilities,
          or complete broker-backed one-use work-unit lifetime authority.
          EOF
